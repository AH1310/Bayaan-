adow:0 20px 70px #1c537313;text-align:center}.auth-logo{width:110px;height:110px;object-fit:cover;border-radius:22px;margin-bottom:15px}.auth-fields{display:grid;gap:15px;text-align:right}.auth-tabs{display:flex;background:#f0f5fa;padding:5px;border-radius:12px;gap:5px;margin:23px 0}.auth-tabs button{flex:1;background:transparent;color:#63748c}.auth-tabs button.active{background:#2476dc;color:white}.auth-message{margin:0;line-height:1.8;font-size:13px;color:#2476dc}.auth-message.error{color:#b83247}.small-note{font-size:12px;margin:20px 0}.auth-card input{background:#fff;color:#19283b;border-color:#dfe9f2}aside footer button{margin-top:10px;width:100%}#accountEmail{display:block;word-break:break-all;direction:ltr}body.dark aside{--nav:#182936}body.dark nav button{color:#b7c8d8}body.dark nav button.active{background:#23483e;color:#c7f6e1}.cloud-banner{font-size:12px;color:var(--muted)}.ah13{display:inline-flex;align-items:center;justify-content:center;width:54px;height:44px;border-radius:10px;background:#b9e7d0;color:#103a2c;font-weight:bold;text-decoration:none;font-size:16px}.sidebar-hidden aside{transform:translateX(100%)}.sidebar-hidden main{margin-right:0}#installButton{white-space:nowrap}.brand .logo{display:inline-block;text-decoration:none}.install-note{line-height:2}.install-note ol{padding-right:24px}

<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),round=n=>Math.round((n+Number.EPSILON)*100)/100;
const fresh=()=>({version:1,settings:{name:'منشأتي',currency:'SAR',tax:0,phone:'',address:'',dark:false},products:[],contacts:[],invoices:[],expenses:[],employees:[],tasks:[],payroll:[],attendance:[]});
const num=(n,min=0)=>Number.isFinite(n)&&n>=min;
let db=fresh(),page='home',query='',draft=[];
const SUPABASE_URL='https://vrzkwyzhrijpamcrrzdi.supabase.co';
const SUPABASE_KEY='sb_publishable_3W2moJj24sZGQEYRmTmNaQ_H4q4ueTC';
async function timedFetch(url,options={}){
 const controller=new AbortController();
 const abort=()=>controller.abort();
 if(options.signal?.aborted)abort();else options.signal?.addEventListener('abort',abort,{once:true});
 const timer=setTimeout(abort,20000);
 try{return await fetch(url,{...options,signal:controller.signal})}
 finally{clearTimeout(timer);options.signal?.removeEventListener('abort',abort)}
}
const cloud=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY,{global:{fetch:timedFetch}});
let currentUser=null,cloudRevision=0,cloudReady=false,cloudSaving=false,cloudLoading=false,sessionGeneration=0;
let authMode='login',authBusy=false;

function upgrade(d){
 if(!d||typeof d!=='object')return d;
 if(d.payroll===undefined)d.payroll=[];if(d.attendance===undefined)d.attendance=[];
 if(Array.isArray(d.invoices))for(const i of d.invoices){if(i.payments===undefined)i.payments=i.paid>0?[{id:'legacy-'+i.id,amount:i.paid,date:i.date,method:'other',reference:''}]:[]}
 return d;
}
function validate(d){
 upgrade(d);
 if(!d||d.version!==1||!d.settings||!['SAR','EGP'].includes(d.settings.currency)||typeof d.settings.name!=='string'||!num(d.settings.tax)||d.settings.tax>100)throw Error('ملف غير صالح أو عملة غير مدعومة؛ استخدم الجنيه المصري أو الريال السعودي');
 const groups=['products','contacts','invoices','expenses','employees','tasks','payroll','attendance'];for(const g of groups){if(!Array.isArray(d[g])||d[g].length>50000)throw Error('بيانات غير صالحة');const ids=new Set();for(const r of d[g]){if(!r||typeof r.id!=='string'||!/^[A-Za-z0-9-]{1,100}$/.test(r.id)||ids.has(r.id))throw Error('معرفات غير صالحة');ids.add(r.id)}}
 for(const p of d.products)if(typeof p.name!=='string'||typeof p.sku!=='string'||!num(p.stock)||!num(p.price)||!num(p.cost)||!num(p.min))throw Error('منتج غير صالح');
 for(const c of d.contacts)if(typeof c.name!=='string'||!['customer','supplier'].includes(c.type))throw Error('جهة غير صالحة');
 for(const e of d.expenses)if(typeof e.name!=='string'||!num(e.amount)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))throw Error('مصروف غير صالح');
 for(const e of d.employees)if(typeof e.name!=='string'||!num(e.salary))throw Error('موظف غير صالح');
 for(const e of d.employees)if(!num(e.allowance??0)||!num(e.deduction??0)||(e.deduction??0)>e.salary+(e.allowance??0))throw Error('بدلات أو خصومات غير صحيحة');
 const seenPayroll=new Set(),seenAttendance=new Set();
 for(const r of d.payroll){if(!d.employees.some(e=>e.id===r.employeeId)||!/^\d{4}-\d{2}$/.test(r.month)||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!num(r.base)||!num(r.allowance)||!num(r.deduction)||!num(r.net)||typeof r.cancelled!=='boolean'||!['cash','card','transfer'].includes(r.method)||Math.abs(round(r.base+r.allowance-r.deduction)-r.net)>.01)throw Error('راتب غير صالح');if(!r.cancelled){const key=r.employeeId+r.month;if(seenPayroll.has(key)||!d.expenses.some(e=>e.payrollId===r.id&&Math.abs(e.amount-r.net)<.01))throw Error('تكرار أو ربط راتب غير صالح');seenPayroll.add(key)}}
 for(const a of d.attendance){const key=a.employeeId+a.date;if(!d.employees.some(e=>e.id===a.employeeId)||!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!['present','absent','leave'].includes(a.status)||seenAttendance.has(key))throw Error('حضور غير صالح');seenAttendance.add(key)}
 for(const t of d.tasks)if(typeof t.name!=='string'||typeof t.done!=='boolean')throw Error('مهمة غير صالحة');
 for(const i of d.invoices){if(!['sale','purchase'].includes(i.type)||typeof i.number!=='string'||typeof i.contactName!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(i.date)||!num(i.total)||!num(i.subtotal)||!num(i.tax)||!num(i.paid)||!num(i.taxRate)||i.taxRate>100||i.paid>i.total||typeof i.cancelled!=='boolean'||!Array.isArray(i.lines)||!i.lines.length)throw Error('فاتورة غير صالحة');let subtotal=0;for(const l of i.lines){if(!d.products.some(p=>p.id===l.productId)||typeof l.name!=='string'||!num(l.qty)||l.qty<=0||!num(l.price)||!num(l.cost))throw Error('بند غير صالح');subtotal+=round(l.qty*l.price)}if(!Array.isArray(i.payments)||i.payments.some(p=>!num(p.amount)||p.amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)||!['cash','card','transfer','other'].includes(p.method))||Math.abs(round(i.payments.reduce((n,p)=>n+p.amount,0))-i.paid)>.01)throw Error('دفعات غير صالحة');if(Math.abs(round(subtotal)-i.subtotal)>.01||Math.abs(round(i.subtotal+i.tax)-i.total)>.01)throw Error('إجمالي غير صحيح')}
}
async function commit(change){
 if(!cloudReady||!currentUser){toast('سجل دخولك وانتظر تحميل البيانات أولًا.');return false}
 if(cloudSaving||cloudLoading){toast('انتظر انتهاء العملية الحالية.');return false}
 if(!navigator.onLine){toast('الحفظ يحتاج اتصالًا بالإنترنت. لم يتم حفظ التغيير.');return false}
 const userId=currentUser.id,generation=sessionGeneration,next=JSON.parse(JSON.stringify(db));
 cloudSaving=true;$('#cloudStatus').textContent='جاري الحفظ…';
 try{
  change(next);validate(next);
  const {data,error}=await cloud.rpc('aamali_save_data',{p_state:next,p_expected_revision:cloudRevision});
  if(error)throw error;
  if(generation!==sessionGeneration||currentUser?.id!==userId)return false;
  validate(data.state);db=data.state;cloudRevision=data.revision;
  $('#cloudStatus').textContent='✓ تم الحفظ';return true;
 }catch(error){
  if(generation!==sessionGeneration)return false;
  if(error.code==='40001'){toast('البيانات تغيّرت على جهاز آخر. اضغط تحديث البيانات ثم أعد العملية.');$('#cloudStatus').textContent='يلزم تحديث البيانات'}
  else{toast('لم يتم الحفظ: '+cloudError(error));$('#cloudStatus').textContent='تعذر الحفظ • حاول مجددًا'}
  return false;
 }finally{if(generation===sessionGeneration)cloudSaving=false}
}
function money(n){return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+({SAR:'ر.س',EGP:'ج.م'}[db.settings.currency])}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,6000)}
const menus=[['home','◫','لوحة التحكم'],['sales','↗','المبيعات'],['purchases','↙','المشتريات'],['invoices','▤','الفواتير'],['products','▦','المخزون'],['customers','♙','العملاء'],['suppliers','♧','الموردون'],['expenses','◉','المصروفات'],['employees','♙','نظام الموظفين'],['payroll','◈','الرواتب والتقارير'],['attendance','◷','الحضور والانصراف'],['calculator','▣','آلة حاسبة'],['tasks','✓','المهام'],['reports','▥','التقارير'],['settings','⚙','الإعدادات']];
function go(p){page=p;query='';render();$('#side').classList.remove('open')}
function render(){document.body.classList.toggle('dark',!!db.settings.dark);$('#theme').textContent=db.settings.dark?'☀ نهاري':'☾ ليلي';$('#company').textContent=db.settings.name;$('#title').textContent=menus.find(m=>m[0]===page)[2];$('#subtitle').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('#nav').innerHTML=menus.map(m=>`<button data-go="${m[0]}" class="${page===m[0]?'active':''}"><span>${m[1]}</span>${m[2]}</button>`).join('');paint()}
function table(head,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">لا توجد بيانات بعد. أضف أول سجل للبدء.</div>'}
const matches=r=>JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
function listing(title,action){return `<div class="section-head"><h2>${title}</h2><div class="actions"><input class="search" id="search" placeholder="بحث في السجلات…" aria-label="بحث" value="${esc(query)}"><button data-add="${action}">＋ إضافة</button></div></div>`}

function chart(sales){const days=Array.from({length:7},(_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);const key=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);return{label:d.toLocaleDateString('ar-EG',{weekday:'short'}),sum:sales.filter(i=>i.date===key).reduce((a,i)=>a+i.subtotal,0)}});const max=Math.max(1,...days.map(d=>d.sum));return `<div class="bars">${days.map(d=>`<div class="bar"><span>${money(d.sum)}</span><i style="height:${Math.max(2,d.sum/max*105)}px"></i><span>${d.label}</span></div>`).join('')}</div>`}
function invoiceTable(arr){return table(['الرقم','التاريخ','الجهة','الإجمالي','المتبقي','الحالة','إجراءات'],arr.map(i=>`<tr><td>${esc(i.number)}</td><td>${i.date}</td><td>${esc(i.contactName)}</td><td>${money(i.total)}</td><td>${i.cancelled?'—':money(i.total-i.paid)}</td><td><span class="badge ${!i.cancelled&&i.paid<i.total?'warn':''}">${i.cancelled?'ملغاة':i.paid>=i.total?'مسددة':i.paid>0?'سداد جزئي':'غير مسددة'}</span></td><td><button class="secondary" data-details="${i.id}">عرض</button><button class="secondary" data-print="${i.id}">طباعة</button>${!i.cancelled?`${i.paid<i.total?`<button class="secondary" data-pay="${i.id}">سداد</button>`:''}<button class="danger" data-cancel="${i.id}">إلغاء</button>`:''}</td></tr>`))}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
const required='required maxlength="120"',numeric='required min="0" max="100000000" step="0.01"';
function openForm(kind,id){if(['sale','purchase'].includes(kind)){invoiceForm(kind);return}const group=kind==='product'?'products':['customer','supplier'].includes(kind)?'contacts':kind==='employee'?'employees':kind==='expense'?'expenses':'tasks';const r=db[group].find(x=>x.id===id)||{};let fields='';
 if(kind==='product')fields=field('اسم المنتج','name',r.name,'text',required)+field('كود المنتج (اختياري)','sku',r.sku,'text','maxlength="60"')+field('سعر البيع','price',r.price??0,'number',numeric)+field('متوسط تكلفة الوحدة','cost',r.cost??0,'number',numeric)+field('الكمية الافتتاحية','stock',r.stock??0,'number',numeric+(id?' disabled':''))+field('حد تنبيه المخزون','min',r.min??5,'number',numeric)+(id?'<small class="full">تعديل الكميات يتم بفواتير البيع والشراء. تعديل التكلفة يؤثر على المبيعات الجديدة فقط.</small>':'');
 if(['customer','supplier'].includes(kind))fields=field('الاسم','name',r.name,'text',required)+field('الهاتف','phone',r.phone,'tel','maxlength="40"')+field('البريد الإلكتروني','email',r.email,'email','maxlength="150"')+field('العنوان','address',r.address,'text','maxlength="300"');
 if(kind==='expense')fields=field('وصف المصروف','name',r.name,'text',required)+field('التصنيف','category',r.category||'عام','text',required)+field('المبلغ','amount',r.amount??'','number',numeric)+field('التاريخ','date',r.date||today(),'date','required');
 if(kind==='employee')fields=field('اسم الموظف','name',r.name,'text',required)+field('الوظيفة','role',r.role,'text','maxlength="100"')+field('الهاتف','phone',r.phone,'tel','maxlength="40"')+field('الراتب الأساسي','salary',r.salary??0,'number',numeric)+field('بدلات شهرية','allowance',r.allowance??0,'number',numeric)+field('خصومات شهرية','deduction',r.deduction??0,'number',numeric)+field('تاريخ التعيين','startDate',r.startDate||today(),'date','required');

 $('#modalTitle').textContent=(id?'تعديل':'إضافة')+' '+({product:'منتج',customer:'عميل',supplier:'مورد',expense:'مصروف',employee:'موظف',task:'مهمة'}[kind]);$('#modalBody').innerHTML=`<form id="recordForm" class="forms">${fields}<button class="full">حفظ</button></form>`;
 $('#recordForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k of ['name','sku','phone','email','address','category','role','assignee'])if(k in f)f[k]=f[k].trim();if(!f.name)return toast('اكتب اسمًا صحيحًا');for(const k of ['price','cost','stock','min','amount','salary','allowance','deduction'])if(k in f)f[k]=Number(f[k]);if(kind==='employee'&&f.deduction>f.salary+f.allowance)return toast('الخصومات لا تتجاوز الراتب والبدلات');if(kind==='product'){if(id)f.stock=r.stock;if(f.sku&&db.products.some(p=>p.sku===f.sku&&p.id!==id))return toast('كود المنتج مستخدم بالفعل')}if(['customer','supplier'].includes(kind))f.type=kind;if(kind==='task')f.done=f.done==='true';f.id=id||uid();if(await commit(d=>{const idx=d[group].findIndex(x=>x.id===id);idx>=0?d[group][idx]=f:d[group].push(f)})){closeModal();render();toast('تم الحفظ')}};$('#modal').showModal();

function invoiceForm(type){if(!db.products.length)return toast('أضف منتجًا أولًا من قسم المخزون');draft=[{productId:db.products[0].id,qty:1,price:type==='sale'?db.products[0].price:db.products[0].cost}];$('#modalTitle').textContent=type==='sale'?'فاتورة بيع جديدة':'فاتورة شراء جديدة';$('#modalBody').innerHTML=`<form id="invoiceForm"><div class="forms"><label>${type==='sale'?'العميل':'المورد'}<select name="contact"><option value="">${type==='sale'?'عميل نقدي':'شراء نقدي'}</option>${db.contacts.filter(c=>c.type===(type==='sale'?'customer':'supplier')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>${field('التاريخ','date',today(),'date','required')}</div><h3 style="margin-top:20px">المنتج · الكمية · سعر الوحدة</h3><div id="lines"></div><button type="button" class="secondary" id="addLine">＋ إضافة بند</button><div class="forms" style="margin-top:20px">${field('الضريبة %','tax',db.settings.tax,'number','required min="0" max="100" step="0.01"')}${field('المبلغ المدفوع','paid',0,'number',numeric)}${methodField('method')}${field('رقم مرجع الدفع (اختياري)','reference','','text','maxlength="80"')}</div><div class="actions" style="margin-top:12px"><button type="button" class="secondary" id="fullPayment">تسديد بالكامل</button><label class="check-label"><input type="checkbox" name="printNow">طباعة بعد الحفظ</label></div><div class="totals" id="invoiceTotal"></div><small>السعر قبل الضريبة. الفاتورة المحفوظة لا تتغير بتعديل بيانات المنتج لاحقًا.</small><br><button style="margin-top:15px;width:100%">حفظ الفاتورة وتحديث المخزون</button></form>`;paintLines(type);$('#addLine').onclick=()=>{draft.push({productId:db.products[0].id,qty:1,price:type==='sale'?db.products[0].price:db.products[0].cost});paintLines(type)};$('#fullPayment').onclick=()=>{$('#invoiceForm [name=paid]').value=totals(draft,Number($('#invoiceForm [name=tax]').value)).total;totalDraft()};$('#invoiceForm').oninput=totalDraft;$('#invoiceForm').onsubmit=e=>saveInvoice(e,type);$('#modal').showModal()}
function paintLines(type){$('#lines').innerHTML=draft.map((l,k)=>`<div class="line"><select aria-label="المنتج" data-line="${k}" data-prop="productId">${db.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${esc(p.name)} (${p.stock})</option>`).join('')}</select><input aria-label="الكمية" type="number" min="0.01" max="1000000" step="0.01" required value="${l.qty}" data-line="${k}" data-prop="qty"><input aria-label="سعر الوحدة" type="number" min="0" max="100000000" step="0.01" required value="${l.price}" data-line="${k}" data-prop="price"><button aria-label="حذف البند" type="button" class="danger" data-remove="${k}" ${draft.length===1?'disabled':''}>✕</button></div>`).join('');$('#lines').onchange=e=>{const k=e.target.dataset.line,prop=e.target.dataset.prop;if(k===undefined)return;draft[k][prop]=prop==='productId'?e.target.value:Number(e.target.value);if(prop==='productId'){const p=db.products.find(x=>x.id===e.target.value);draft[k].price=type==='sale'?p.price:p.cost;paintLines(type)}totalDraft()};$('#lines').oninput=e=>{if(e.target.dataset.line!==undefined&&e.target.dataset.prop!=='productId'){draft[e.target.dataset.line][e.target.dataset.prop]=Number(e.target.value);totalDraft()}};$('#lines').onclick=e=>{const k=e.target.dataset.remove;if(k!==undefined){draft.splice(Number(k),1);paintLines(type)}};totalDraft()}

async function saveInvoice(e,type){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),rate=Number(f.tax),paid=Number(f.paid);if(draft.some(l=>!num(l.qty)||l.qty<=0||!num(l.price)))return toast('تحقق من الكميات والأسعار');const t=totals(draft,rate);if(!num(paid)||paid>t.total)return toast('المدفوع يجب ألا يتجاوز إجمالي الفاتورة');const quantities={};for(const l of draft)quantities[l.productId]=round((quantities[l.productId]||0)+l.qty);if(type==='sale')for(const [id,qty] of Object.entries(quantities)){const p=db.products.find(x=>x.id===id);if(qty>p.stock)return toast('المخزون غير كافٍ للمنتج: '+p.name)}const invoiceId=uid();const c=db.contacts.find(c=>c.id===f.contact),lines=draft.map(l=>({...l,name:db.products.find(p=>p.id===l.productId).name,cost:db.products.find(p=>p.id===l.productId).cost}));

function employeeReport(id){const e=db.employees.find(e=>e.id===id);if(!e)return;const rows=db.payroll.filter(r=>r.employeeId===id&&!r.cancelled),attendance=db.attendance.filter(a=>a.employeeId===id&&a.date.startsWith(payrollMonth));$('#modalTitle').textContent='تقرير الموظف • '+e.name;$('#modalBody').innerHTML=`<p>${esc(e.role)} • ${esc(e.phone)} • تاريخ التعيين ${esc(e.startDate||'—')}</p><div class="mini-summary"><span class="badge">الصافي الحالي ${money(netSalary(e))}</span><span class="badge">إجمالي المصروف ${money(rows.reduce((a,r)=>a+r.net,0))}</span></div><h3>حضور شهر ${payrollMonth}</h3><div class="mini-summary">${[['present','حضور'],['absent','غياب'],['leave','إجازة']].map(([k,l])=>`<span class="badge">${l}: ${attendance.filter(a=>a.status===k).length} يوم</span>`).join('')}</div><h3>الرواتب المصروفة</h3>${table(['الشهر','التاريخ','الصافي','الإيصال'],rows.slice().reverse().map(r=>`<tr><td>${r.month}</td><td>${r.date}</td><td>${money(r.net)}</td><td><button class="secondary" data-print-salary="${r.id}">طباعة</button></td></tr>`))}`;if(!$('#modal').open)$('#modal').showModal()}
const attendanceNames={present:'حاضر',absent:'غائب',leave:'إجازة'};
function attendancePage(){const rows=db.attendance.filter(a=>a.date.startsWith(attendanceMonth));return `<div class="section-head"><h2>الحضور والانصراف</h2><div class="actions"><input class="filter-month" id="attendanceMonth" type="month" value="${attendanceMonth}" aria-label="الشهر"><button data-action="attendance">＋ تسجيل يوم</button></div></div><div class="card">${table(['الموظف','التاريخ','الحالة','دخول','خروج','ملاحظات','إجراءات'],rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${esc(db.employees.find(e=>e.id===a.employeeId)?.name)}</td><td>${a.date}</td><td><span class="badge ${a.status==='absent'?'warn':''}">${attendanceNames[a.status]}</span></td><td>${esc(a.inTime||'—')}</td><td>${esc(a.outTime||'—')}</td><td>${esc(a.note)}</td><td><button class="secondary" data-attendance="${a.id}">تعديل</button><button class="danger" data-delete="attendance" data-id="${a.id}">حذف</button></td></tr>`))}</div>`}
function attendanceForm(id){if(!db.employees.length)return toast('أضف موظفًا أولًا');const r=db.attendance.find(a=>a.id===id)||{};$('#modalTitle').textContent='تسجيل حضور موظف';$('#modalBody').innerHTML=`<form id="attendanceForm" class="forms"><label>الموظف<select name="employeeId">${db.employees.map(e=>`<option value="${e.id}" ${e.id===r.employeeId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>${field('التاريخ','date',r.date||today(),'date','required')}<label>الحالة<select name="status">${Object.entries(attendanceNames).map(([k,n])=>`<option value="${k}" ${k===r.status?'selected':''}>${n}</option>`).join('')}</select></label>${field('وقت الدخول','inTime',r.inTime||'','time')}${field('وقت الخروج','outTime',r.outTime||'','time')}${field('ملاحظات','note',r.note||'','text','maxlength="200"')}<button class="full">حفظ</button></form>`;$('#attendanceForm').onsubmit=async event=>{event.preventDefault();const f=Object.fromEntries(new FormData(event.target));if(db.attendance.some(a=>a.employeeId===f.employeeId&&a.date===f.date&&a.id!==id))return toast('هذا اليوم مسجل للموظف؛ عدّل السجل الموجود');if(f.status!=='present'){f.inTime='';f.outTime=''}f.id=id||uid();if(await commit(d=>{const index=d.attendance.findIndex(a=>a.id===id);if(index<0)d.attendance.push(f);else d.attendance[index]=f})){attendanceMonth=f.date.slice(0,7);closeModal();render();toast('تم حفظ الحضور')}};if(!$('#modal').open)$('#modal').showModal()}
let calcExpression='',calcAnswer=false;
function calculatorPage(){return `<div class="card calc"><h2>آلة حاسبة</h2><div id="calcDisplay" class="calc-display" aria-live="polite">0</div><div class="calc-keys">${['AC','DEL','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>`<button data-calc="${k}" class="${k==='='?'eq':['÷','×','−','+'].includes(k)?'op':''}" aria-label="${k==='DEL'?'حذف آخر رقم':k==='AC'?'مسح الكل':k}">${k==='DEL'?'⌫':k}</button>`).join('')}</div><p class="muted">أولوية العمليات: الضرب والقسمة قبل الجمع والطرح. % تقسم آخر رقم على 100.</p></div>`}
function evaluateExpression(expression){const source=expression.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');const tokens=source.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+*/-]/g)||[];if(tokens.join('')!==source||!tokens.length)throw Error('عملية غير صحيحة');let pos=0;const atom=()=>{let sign=1;while(tokens[pos]==='+'||tokens[pos]==='-'){if(tokens[pos++]==='-')sign*=-1}const token=tokens[pos++];if(!token||!/^(\d+(\.\d*)?|\.\d+)$/.test(token))throw Error('عملية غير مكتملة');return sign*Number(token)};const product=()=>{let value=atom();while(tokens[pos]==='*'||tokens[pos]==='/'){const op=tokens[pos++],right=atom();if(op==='/'&&right===0)throw Error('لا يمكن القسمة على صفر');value=op==='*'?value*right:value/right}return value};let value=product();while(pos<tokens.length){const op=tokens[pos++];if(!['+','-'].includes(op))throw Error('عملية غير صحيحة');const right=product();value=op==='+'?value+right:value-right}if(!Number.isFinite(value))throw Error('النتيجة أكبر من الحد المسموح');return Number(value.toPrecision(12)).toLocaleString('en-US',{useGrouping:false,maximumSignificantDigits:12})}
function updateCalc(){if($('#calcDisplay'))$('#calcDisplay').textContent=calcExpression||'0'}
function calcKey(k){if(k==='AC'){calcExpression='';calcAnswer=false}else if(k==='DEL'){calcExpression=calcExpression.slice(0,-1);calcAnswer=false}else if(k==='='){try{calcExpression=evaluateExpression(calcExpression);calcAnswer=true}catch(error){toast(error.message)}}else if(k==='%'||k==='±'){const match=calcExpression.match(/(?:^|[+×÷−])(-?(?:\d+(?:\.\d*)?|\.\d+))$/);if(match){const value=Number(match[1])*(k==='%'?.01:-1),start=calcExpression.length-match[1].length;calcExpression=calcExpression.slice(0,start)+String(value);calcAnswer=false}}else if(/[0-9.]/.test(k)&&k.length===1){if(calcAnswer){calcExpression='';calcAnswer=false}const tail=calcExpression.split(/[+×÷−]/).pop();if(k==='.'&&tail.includes('.'))return;if(k==='.'&&!tail)calcExpression+='0';calcExpression+=k}else if(['+','−','×','÷'].includes(k)){calcAnswer=false;if(!calcExpression){if(k==='−')calcExpression='−'}else if(/[+×÷−]$/.test(calcExpression)){if(k==='−'&&!calcExpression.endsWith('−'))calcExpression+='−';else calcExpression=calcExpression.replace(/[+×÷−]+$/,k)}else calcExpression+=k}if(calcExpression.length>160)calcExpression=calcExpression.slice(0,160);updateCalc()}
document.addEventListener('change',event=>{if(event.target.id==='payrollMonth'){payrollMonth=event.target.value||today().slice(0,7);paint()}if(event.target.id==='attendanceMonth'){attendanceMonth=event.target.value||today().slice(0,7);paint()}});
document.addEventListener('keydown',event=>{if(page!=='calculator'||$('#modal').open||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;const key=event.key==='Enter'?'=':event.key==='Escape'?'AC':event.key==='Backspace'?'DEL':({'*':'×','/':'÷','-':'−'}[event.key]||event.key);if(['AC','DEL','=','+','−','×','÷','.','%'].includes(key)||/^\d$/.test(key)){event.preventDefault();calcKey(key)}});

function authMessage(message,error=false){$('#authMessage').textContent=message;$('#authMessage').classList.toggle('error',error)}
function cloudError(error){
 const m=error?.message||'';
 if(error?.code==='23514')return 'البيانات غير صالحة أو تجاوزت الحد المسموح للحساب (5 ميجابايت)';
 if(/Invalid login credentials/i.test(m))return 'البريد أو كلمة المرور غير صحيحة';
 if(/Email not confirmed/i.test(m))return 'الحساب يحتاج تأكيد البريد. تواصل مع مسؤول الموقع';
 if(/already registered|already been registered/i.test(m))return 'البريد مستخدم بالفعل. جرّب تسجيل الدخول';
 if(/rate limit|too many requests/i.test(m))return 'محاولات كثيرة. انتظر قليلًا ثم حاول';
 if(/fetch|network|Failed to fetch|abort|timeout/i.test(m))return 'تعذر الاتصال. راجع الإنترنت وأعد المحاولة';
 if(/aamali_get_data|aamali_save_data|schema cache/i.test(m))return 'إعدادات حفظ البيانات غير مكتملة. تواصل مع مسؤول الموقع';
 if(/Password should|weak password/i.test(m))return 'اختر كلمة مرور أقوى، 8 أحرف على الأقل';
 return m||'حدث خطأ في الاتصال';
}
function setAuthMode(mode){
 if(authBusy)return;authMode=mode;const signup=mode==='signup';
 $('#loginTab').classList.toggle('active',!signup);$('#signupTab').classList.toggle('active',signup);
 $('#nameField').hidden=!signup;$('#confirmField').hidden=!signup;
 $('#authName').required=signup;$('#authConfirm').required=signup;
 $('#authPassword').autocomplete=signup?'new-password':'current-password';
 $('#authSubmit').textContent=signup?'إنشاء حساب':'تسجيل دخول';authMessage('');
}
function signedOut(){
 sessionGeneration++;currentUser=null;cloudReady=false;cloudLoading=false;cloudSaving=false;
 db=fresh();cloudRevision=0;page='home';query='';draft=[];calcExpression='';calcAnswer=false;
 $('#view').innerHTML='';$('#printArea').innerHTML='';closeModal();
 $('#app').hidden=true;$('#authScreen').hidden=false;$('#loadRetry').hidden=true;
 document.body.classList.remove('dark');$('#authSubmit').disabled=!cloud;
}
async function loadCloud(session){
 if(!session){signedOut();return}
 if(currentUser?.id===session.user.id&&(cloudReady||cloudLoading))return;
 if(currentUser?.id!==session.user.id){db=fresh();page='home';query='';draft=[];calcExpression='';calcAnswer=false;$('#view').innerHTML='';$('#printArea').innerHTML='';closeModal();cloudSaving=false}
 const generation=++sessionGeneration;currentUser=session.user;cloudLoading=true;cloudReady=false;
 $('#app').hidden=true;$('#authScreen').hidden=false;authMessage('جاري تحميل بيانات حسابك…');$('#loadRetry').hidden=true;
 try{
  const {data,error}=await cloud.rpc('aamali_get_data');if(error)throw error;
  if(generation!==sessionGeneration)return;
  validate(data.state);db=data.state;cloudRevision=data.revision;cloudReady=true;
  $('#accountEmail').textContent=currentUser.email||'';$('#cloudStatus').textContent='✓ جاهز للعمل';
  $('#authScreen').hidden=true;$('#app').hidden=false;$('#authPassword').value='';$('#authConfirm').value='';render();
 }catch(error){
  if(generation!==sessionGeneration)return;
  authMessage('تعذر تحميل البيانات: '+cloudError(error),true);$('#loadRetry').hidden=false;
 }finally{if(generation===sessionGeneration){cloudLoading=false;$('#authSubmit').disabled=false}}
}
$('#loginTab').onclick=()=>setAuthMode('login');$('#signupTab').onclick=()=>setAuthMode('signup');
$('#authForm').onsubmit=async e=>{
 e.preventDefault();if(authBusy||!cloud)return;
 const email=$('#authEmail').value.trim(),password=$('#authPassword').value,name=$('#authName').value.trim();
 if(authMode==='signup'&&password!==$('#authConfirm').value)return authMessage('كلمتا المرور غير متطابقتين',true);
 if(authMode==='signup'&&!name)return authMessage('اكتب اسمك',true);
 authBusy=true;$('#authSubmit').disabled=true;authMessage('جاري الاتصال…');
 try{
  const result=authMode==='signup'
   ?await cloud.auth.signUp({email,password,options:{data:{display_name:name}}})
   :await cloud.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  if(result.data.session)await loadCloud(result.data.session);
  else authMessage('لم تبدأ جلسة الدخول. قد يحتاج الحساب تأكيد البريد. تواصل مع مسؤول الموقع.',true);
 }catch(error){authMessage(cloudError(error),true)}
 finally{authBusy=false;$('#authSubmit').disabled=false}
};
$('#loadRetry').onclick=async()=>{const {data,error}=await cloud.auth.getSession();if(error)return authMessage(cloudError(error),true);await loadCloud(data.session)};
$('#syncButton').onclick=async()=>{
 if(cloudSaving||cloudLoading)return toast('انتظر انتهاء العملية الحالية');
 if($('#modal').open)return toast('أغلق النموذج قبل تحديث البيانات');
 const {data,error}=await cloud.auth.getSession();if(error)return toast(cloudError(error));
 cloudReady=false;await loadCloud(data.session);
};
$('#logoutButton').onclick=async()=>{
 if(cloudSaving)return toast('انتظر انتهاء الحفظ أولًا');
 const {error}=await cloud.auth.signOut({scope:'local'});
 if(error){toast(cloudError(error));return}signedOut();authMessage('تم تسجيل الخروج');
};
if(cloud){
 cloud.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{
   if(event==='SIGNED_OUT'||!session)signedOut();
   else loadCloud(session);
  },0);
 });
}else{
 authMessage('تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم أعد تحميل الصفحة.',true);
}
</script></body></html>
